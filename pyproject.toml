[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "familywall-mcp"
version = "0.1.0"
description = "A safe, typed foundation for a FamilyWall MCP server."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.10,<3",
]

[project.scripts]
familywall-mcp = "familywall_mcp.cli:main"

[dependency-groups]
dev = [
  "build>=1.2,<2",
  "detect-secrets>=1.5,<2",
  "mypy>=1.14,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<2",
  "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/familywall_mcp"]

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
markers = [
  "live: requires an explicitly authorised test-family and network access",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[tool.detect-secrets]
exclude_files = '(^|/)(uv\.lock|\.git/|\.venv/)'
