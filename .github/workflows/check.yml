name: checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install locked dependencies
        run: uv sync --frozen --group dev
      - name: Lint
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .
      - name: Type check
        run: uv run mypy src
      - name: Offline tests
        run: uv run pytest -m 'not live'
      - name: Build
        run: uv build
      - name: Secret scan
        run: >-
          uv run detect-secrets scan --baseline .secrets.baseline --all-files
          --exclude-files '(^|/)(uv\.lock|\.git/|\.venv/|\.mypy_cache/|\.pytest_cache/|\.ruff_cache/|\.uv-cache/|dist/)'
